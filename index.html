<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Agent - 智能原型助手</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- 左侧：历史对话列表 -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <span class="brand-icon">🎨</span>
                    <h2>HR Agent</h2>
                </div>
                <button class="new-chat-btn" id="new-chat-btn">
                    <span>+</span> 新建对话
                </button>
            </div>
            
            <!-- 搜索框 -->
            <div class="search-box">
                <input type="text" placeholder="搜索对话..." id="search-chats">
            </div>
            
            <!-- 历史对话列表 -->
            <div class="chat-list" id="chat-list">
                <div class="empty-chats">暂无历史对话</div>
            </div>
        </aside>

        <!-- 中间：主对话区域 -->
        <main class="main-chat">
            <!-- 对话消息区 -->
            <div class="chat-messages" id="chat-messages">
                <div class="welcome-card">
                    <div class="welcome-icon">👋</div>
                    <h3>我是你的HR系统原型助手</h3>
                    <p>输入HR业务场景，我帮你自动生成原型和PRD</p>
                    <div class="command-examples">
                        <div class="cmd-example" onclick="insertCommand('帮我设计一个员工考勤系统，支持打卡、请假、加班审批')">
                            <span class="cmd-label">设计</span>
                            <span>帮我设计一个员工考勤系统...</span>
                        </div>
                        <div class="cmd-example" onclick="insertCommand('修改登录页面，添加验证码功能')">
                            <span class="cmd-label">修改</span>
                            <span>修改登录页面，添加验证码...</span>
                        </div>
                        <div class="cmd-example" onclick="insertCommand('从第3步开始，设计薪酬系统')">
                            <span class="cmd-label">步骤</span>
                            <span>从第3步开始，设计薪酬系统...</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-wrapper">
                <div class="input-box">
                    <textarea 
                        id="chat-input" 
                        placeholder="输入HR业务场景或命令..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="send-btn">
                        <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="input-tips">
                    <span>Enter 发送</span>
                    <span>Shift + Enter 换行</span>
                </div>
            </div>
        </main>
    </div>

    <script src="app-v2.js"></script>
</body>
</html>
